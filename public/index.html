<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NDS-Shop Bot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    marked.setOptions({ breaks: true, gfm: true });
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <!-- Login -->
  <div id="login" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 rounded-2xl p-8 border border-slate-800">
      <img src="/logo.png" onerror="this.style.display='none'" class="w-12 h-12 rounded-xl mb-4 mx-auto" />
      <h1 class="text-2xl font-bold text-center mb-1">NDS-Shop Bot</h1>
      <p class="text-sm text-slate-400 text-center mb-6">Dashboard — utilisez vos identifiants du back-office upload</p>
      <form id="loginForm" class="space-y-3">
        <input id="email" type="email" placeholder="Email" required class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <input id="password" type="password" placeholder="Mot de passe" required class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <button class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm transition">Connexion</button>
      </form>
      <p id="loginError" class="hidden text-red-400 text-sm text-center mt-3"></p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <!-- Topbar -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="/logo.png" onerror="this.style.display='none'" class="w-8 h-8 rounded-lg" />
          <span class="font-bold">NDS-Shop Bot</span>
          <span id="botStatusBadge" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">…</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="userName" class="text-sm text-slate-400"></span>
          <button onclick="logout()" class="text-sm px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800">Déconnexion</button>
        </div>
      </div>
      <nav class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto pb-2">
        <button data-tab="overview" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800">Vue d'ensemble</button>
        <button data-tab="announcements" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800">Annonces</button>
        <button data-tab="games" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800">Jeux</button>
        <button data-tab="send" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800">Envoyer</button>
        <button data-tab="logs" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800">Logs</button>
        <button data-tab="settings" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800">Réglages</button>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
      <!-- Overview -->
      <section id="tab-overview" class="tab-panel">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-slate-900 rounded-xl p-5 border border-slate-800">
            <p class="text-xs text-slate-400">Bot</p>
            <p id="stBot" class="text-xl font-bold mt-1">—</p>
          </div>
          <div class="bg-slate-900 rounded-xl p-5 border border-slate-800">
            <p class="text-xs text-slate-400">Serveur</p>
            <p id="stGuild" class="text-xl font-bold mt-1">—</p>
          </div>
          <div class="bg-slate-900 rounded-xl p-5 border border-slate-800">
            <p class="text-xs text-slate-400">Membres</p>
            <p id="stMembers" class="text-xl font-bold mt-1">—</p>
          </div>
          <div class="bg-slate-900 rounded-xl p-5 border border-slate-800">
            <p class="text-xs text-slate-400">Jeux au catalogue</p>
            <p id="stGames" class="text-xl font-bold mt-1">—</p>
          </div>
        </div>
        <div class="mt-6 bg-slate-900 rounded-xl p-5 border border-slate-800">
          <h2 class="font-semibold mb-2">Actions rapides</h2>
          <div class="flex flex-wrap gap-3">
            <button onclick="triggerPoll()" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">Scanner les nouveaux jeux</button>
          </div>
        </div>
      </section>

      <!-- Announcements -->
      <section id="tab-announcements" class="tab-panel hidden">
        <div class="bg-slate-900 rounded-xl p-5 border border-slate-800">
          <h2 class="font-semibold mb-4">Nouvelle annonce (markdown)</h2>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="space-y-3">
              <input id="anTitle" placeholder="Titre" class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <select id="anChannel" class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm"></select>
              <textarea id="anContent" rows="8" placeholder="**Écrivez votre annonce en markdown…**" class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
              <button onclick="saveAnnouncement()" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm">Enregistrer</button>
            </div>
            <div>
              <p class="text-xs text-slate-400 mb-2">Préview</p>
              <div id="anPreview" class="prose prose-invert prose-sm bg-slate-800 rounded-lg p-4 min-h-[280px] text-sm"></div>
            </div>
          </div>
        </div>

        <div id="announcementsList" class="mt-6 space-y-3"></div>
      </section>

      <!-- Games -->
      <section id="tab-games" class="tab-panel hidden">
        <div class="bg-slate-900 rounded-xl p-5 border border-slate-800">
          <input id="gameSearch" oninput="searchGames()" placeholder="Rechercher un jeu…" class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div id="gamesList" class="mt-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </section>

      <!-- Send -->
      <section id="tab-send" class="tab-panel hidden">
        <div class="bg-slate-900 rounded-xl p-5 border border-slate-800 space-y-3">
          <h2 class="font-semibold">Envoyer un message</h2>
          <select id="sendChannel" class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm"></select>
          <textarea id="sendContent" rows="5" placeholder="Message (markdown supporté)" class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          <button onclick="sendMessage()" class="w-full py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-semibold text-sm">Envoyer</button>
        </div>
      </section>

      <!-- Logs -->
      <section id="tab-logs" class="tab-panel hidden">
        <div class="bg-slate-900 rounded-xl p-5 border border-slate-800">
          <h2 class="font-semibold mb-3">Journal d'activité</h2>
          <div id="logsList" class="space-y-1 text-sm font-mono max-h-[60vh] overflow-y-auto"></div>
        </div>
      </section>

      <!-- Settings -->
      <section id="tab-settings" class="tab-panel hidden">
        <div class="bg-slate-900 rounded-xl p-5 border border-slate-800 space-y-4">
          <h2 class="font-semibold">Réglages du bot</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-2">
              <label class="text-xs text-slate-400">Message de bienvenue (markdown)</label>
              <textarea id="setWelcome" rows="4" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
              <button onclick="saveSetting('welcomeMessage', document.getElementById('setWelcome').value)" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">Enregistrer</button>
            </div>
            <div class="space-y-2">
              <label class="text-xs text-slate-400">Intervalle de scan des nouveaux jeux (ms)</label>
              <input id="setPoll" type="number" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              <button onclick="saveSetting('pollInterval', document.getElementById('setPoll').value)" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-medium">Enregistrer</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
